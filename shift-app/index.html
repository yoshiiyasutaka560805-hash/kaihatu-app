<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; form-action 'none'">
<meta name="robots" content="noindex,nofollow">
<title>勤務表 半自動作成</title>
<style>
:root{/* 見た目の変更はここだけ：法人サイトの配色に合わせる場合はこの値を差し替える */--bg:#f6f6f6;--fg:#222;--line:#d6d6d6;--hd:#ececec;--band:#e8eee4;--surface:#fff;--err:#d93025;--warn:#f29900;--accent:#2b2e33;--accent-fg:#fff;--focus:#6a9a3a}
*{box-sizing:border-box}
body{margin:0;letter-spacing:.04em;font:13px/1.5 "Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;background:var(--bg);color:var(--fg)}
header{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
header h1{font-size:15px;margin:0 14px 0 0;letter-spacing:.3em;font-weight:600;padding-left:10px;border-left:3px solid #e8a33d;line-height:1.2}
header h1 small{display:block;font-size:10px;letter-spacing:.5em;font-weight:400;color:#666}
button,select{font:inherit;letter-spacing:.06em;padding:6px 14px;border:1px solid var(--fg);background:var(--surface);color:var(--fg);border-radius:2px;cursor:pointer}
button:hover{background:var(--hd)}button.pri:hover,nav button.on:hover{background:#000}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
nav{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px 0}
nav button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
main{padding:10px 12px}
.pane{display:none}.pane.on{display:block}
textarea{width:100%;height:260px;font:12px monospace;border:1px solid var(--line);border-radius:2px;padding:6px}
.layout{display:flex;gap:10px;align-items:flex-start}
.gridwrap{overflow:auto;flex:1;max-height:calc(100vh - 150px);background:var(--surface);border:1px solid var(--line)}
table.g{border-collapse:collapse;font-size:12px}
table.g th,table.g td{border:1px solid var(--line);text-align:center;padding:0;min-width:30px;height:24px;white-space:nowrap}
table.g th{background:var(--hd);position:sticky;top:0;z-index:2}
table.g td.nm,table.g th.nm{position:sticky;left:0;background:var(--surface);text-align:left;padding:0 6px;min-width:130px;z-index:1}
table.g th.nm{background:var(--hd);z-index:3}
table.g td.sum{background:#fafafa;min-width:34px;color:#555}
th.we-6{color:#1565c0}th.we-0,th.hol{color:#d93025}
td.c{cursor:pointer;user-select:none}
td.c.pin{box-shadow:inset 0 0 0 2px #7b1fa2}
td.c.E{outline:2px solid var(--err);outline-offset:-2px}
td.c.W{outline:2px solid var(--warn);outline-offset:-2px}
td.c.off{background:#eef0f3;color:#667}
td.c.lv{background:var(--surface)59d}
td.c.n{background:#283593;color:#fff}
td.c.ake{background:#9fa8da}
td.c.jun{background:#ce93d8}
td.c.e{background:#c8e6c9}
td.c.l{background:#ffe0b2}
td.c.le{background:#ffcc80}
td.c.x{background:var(--surface)}
td.c.lock{background:#e0e0e0}
.side{width:340px;max-height:calc(100vh - 150px);overflow:auto;background:var(--surface);border:1px solid var(--line);padding:8px}
.side h3{margin:0 0 6px;font-size:13px}
.iss{padding:3px 4px;border-bottom:1px solid #eee;cursor:pointer}
.iss:hover{background:#f0f4ff}
.tagE{color:#fff;background:var(--err);padding:0 4px;border-radius:3px;margin-right:4px}
.tagW{color:#fff;background:var(--warn);padding:0 4px;border-radius:3px;margin-right:4px}
#pal{position:fixed;display:none;z-index:50;background:var(--surface);border:1px solid #888;border-radius:6px;padding:6px;box-shadow:0 4px 14px #0004;width:230px}
#pal button{margin:2px;padding:4px 7px}
.note{color:#555;font-size:12px;margin:6px 0}
table.t{border-collapse:collapse;background:var(--surface)}
table.t th,table.t td{border:1px solid var(--line);padding:3px 7px}
table.t input[type=number]{width:52px}
.bad{color:var(--err)}
@media print{header,nav,.side,.ctl{display:none}.gridwrap{max-height:none;overflow:visible}}
</style>
</head>
<body>
<header>
  <h1><small>新生福祉会　楽生苑</small>勤務表 半自動作成</h1>
  <button id="bGen" class="pri">シフト作成（希望休を反映して自動作成）</button>
  <button id="bFill">空欄だけ埋める</button>
  <button id="bCopy">Excel用にコピー</button>
  <button id="bPrint">印刷</button>
  <button id="bView">閲覧用ファイルを保存</button>
  <span id="status" class="note"></span>
</header>
<nav>
  <button data-p="import">① 取込・新しい月</button>
  <button data-p="req">② 希望休入力</button>
  <button data-p="rules">③ 必要人数・夜勤職員設定</button>
  <button data-p="part">④ 非常勤・個別条件</button>
  <button data-p="sheet">⑤ 勤務表・チェック</button>
  <button data-p="fte">⑥ 常勤換算</button>
</nav>
<main>
<section id="p-import" class="pane">
  <p class="note">Excelの勤務表を<b>範囲選択→コピー→下の枠に貼り付け</b>（タブ区切り）。見出し行は「No／氏名／1〜31」の行と曜日行が必要です。職員名等の個人情報はこの端末のブラウザ内にのみ保存され、外部へ送信されません。</p>
  <textarea id="paste" placeholder="ここに貼り付け"></textarea>
  <p><button id="bImport" class="pri">取り込む</button> <button id="bSample">架空データで試す</button> <button id="bClear">保存データを消す</button></p>
  <div id="importMsg" class="note"></div>
  <div id="monthBox"></div>
</section>
<section id="p-sheet" class="pane">
  <div class="ctl" style="margin-bottom:6px">
    表示：<select id="secSel"></select>
    <span class="note">セルをクリックで記号選択／Shift+クリックで「固定」（紫枠。自動作成で動かさない＝希望休など）／赤枠=エラー・橙枠=注意</span>
  </div>
  <div class="layout"><div class="gridwrap" id="grid"></div><div class="side" id="issues"></div></div>
</section>
<section id="p-req" class="pane"></section>
<section id="p-rules" class="pane"></section>
<section id="p-part" class="pane"></section>
<section id="p-fte" class="pane"></section>
</main>
<div id="pal"></div>

<script>
//#ENGINE-START
'use strict';
const SHIFTS = ['早','日','遅','遅E','夜','準夜勤'];
const NIGHT_FIX = ['／'];
const LEAVE = new Set(['有休','リ休','誕休','忌引','産休','欠','研修','特休','公(忌引)']);
const PALETTE = ['早','日','遅','遅E','夜','／','準夜勤','公','有休','リ休','誕休','研修','欠',''];

function normSym(v){
  v = String(v == null ? '' : v).replace(/[\r\n]+/g, ' ').trim();
  if (v === '/' ) v = '／';
  return v;
}
function cls(v){
  if (!v) return 'blank';
  if (v === '公') return 'off';
  if (v === '／') return 'ake';
  if (LEAVE.has(v)) return 'leave';
  return 'work';
}
const isWorkish = v => { const k = cls(v); return k === 'work' || k === 'ake'; };

function parseTSV(text){
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){
      if (ch === '"'){ if (text[i+1] === '"'){ cur += '"'; i++; } else q = false; }
      else cur += ch;
    } else if (ch === '"' && cur === '') q = true;
    else if (ch === '\t'){ row.push(cur); cur = ''; }
    else if (ch === '\n'){ row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (ch === '\r'){ /* skip */ }
    else cur += ch;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows;
}

function normTitle(t){ return String(t || '').normalize('NFKC').trim(); }

// 取込：貼り付けテキスト → 状態
function importText(text){
  const rows = parseTSV(text);
  let y = null, m = null;
  const mm = text.match(/令和\s*(\d+)\s*年\s*(\d+)\s*月/);
  if (mm){ y = 2018 + (+mm[1]); m = +mm[2]; }
  const sections = [], staff = [];
  let cur = null, label = '';
  for (const raw of rows){
    const r = raw.map(x => String(x == null ? '' : x).trim());
    if (r[2] === '1' && r[3] === '2' && r[4] === '3'){
      let D = 0; while (/^\d+$/.test(r[2 + D] || '')) D++;
      cur = { id: sections.length, title: normTitle(r[0] === 'No' ? '' : r[0]), D, auto: false };
      sections.push(cur); label = ''; continue;
    }
    if (!cur) continue;
    if (r[0] === 'No') continue;
    const rest = r.slice(2).every(x => x === '');
    if (r[0] && !r[1] && rest){
      if (/^[A-Za-z]{1,3}$/.test(r[0])) label = r[0];
      else if (!cur.title && !staff.some(s => s.sec === cur.id)) cur.title = normTitle(r[0]);
      continue;
    }
    if (!r[1]) continue;
    const cells = [];
    for (let d = 0; d < cur.D; d++) cells.push(normSym(r[2 + d]));
    staff.push({ id: staff.length, sec: cur.id, label, koyo: r[0], name: r[1].replace(/\s+/g, ' ').trim(), cells });
  }
  const used = sections.filter(s => staff.some(t => t.sec === s.id));
  if (!used.length) throw new Error('勤務表の見出し行（No／氏名／1 2 3…）が見つかりません');
  const D = Math.max(...used.map(s => s.D));
  if (!y){ const n = new Date(); y = n.getFullYear(); m = n.getMonth() + 1; }
  const secs = used.map(s => ({ ...s, title: s.title || '全体' }));
  const S = { y, m, D, sections: secs, staff: staff.filter(t => secs.some(s => s.id === t.sec)),
              needs: {}, holidays: [], maxConsec: 5 };
  for (const sec of S.sections)
    sec.auto = S.staff.some(t => t.sec === sec.id && t.cells.includes('夜'));
  for (const t of S.staff){
    const secT = S.sections.find(s => s.id === t.sec);
    const cnt = k => t.cells.filter(c => c === k).length;
    const main = SHIFTS.some(k => cnt(k) > 0);
    t.auto = secT.auto && main;
    t.unit = secT.title + '/' + (t.label || '');
    let from = 0; while (from < t.cells.length && t.cells[from] === '') from++;
    t.from = from >= t.cells.length ? 0 : from;
    t.canNight = cnt('夜') > 0; t.canJun = cnt('準夜勤') > 0; t.canE = cnt('遅E') > 0;
    t.target = cnt('公');
    t.pref = { '早': cnt('早') + 1, '日': cnt('日') + 1, '遅': cnt('遅') + cnt('遅E') + 1 };
    t.pins = t.cells.map(() => false);
    if (t.cells.some(c => cls(c) === 'leave')) t.cells.forEach((c, d) => { if (cls(c) === 'leave') t.pins[d] = true; });
  }
  S.fte = defaultFte(); const seenF = new Set();
  for (const t of S.staff){ initExtras(t, S); initFte(t, S, seenF); }
  S.reqLimit = 2;
  resetNeeds(S);
  return S;
}

const REQ_TYPES = ['希望休','有休','リ休','誕休','研修'];
const dowOf = (S, d) => new Date(S.y, S.m - 1, d + 1).getDay();
const weekOf = (S, d) => Math.floor((d + dowOf(S, 0)) / 7);
// 非常勤・日勤職員の「今までの働き方」を取込んだ表から読み取る
function inferPart(t, S){
  const c = t.cells, f = {};
  c.forEach(v => { if (cls(v) === 'work') f[v] = (f[v] || 0) + 1; });
  const keys = Object.keys(f); if (!keys.length) return null;
  const sym = keys.sort((a, b) => f[b] - f[a])[0];
  const tot = Array(7).fill(0), wk = Array(7).fill(0), byWeek = {};
  c.forEach((v, d) => {
    if (cls(v) === 'leave') return;
    const w = dowOf(S, d); tot[w]++;
    if (cls(v) === 'work'){ wk[w]++; byWeek[weekOf(S, d)] = (byWeek[weekOf(S, d)] || 0) + 1; }
  });
  const allowed = tot.map((n, w) => n > 0 && wk[w] / n >= 0.2);
  if (!allowed.some(Boolean)) allowed.fill(true);
  return { sym, allowed, workTarget: keys.reduce((a, k) => a + f[k], 0), restTarget: c.filter(v => v === '公').length,
           restSym: c.includes('公') ? '公' : '', perWeek: Math.max(1, ...Object.values(byWeek)) };
}
function initExtras(t, S){
  if (t.nightFixed === undefined) t.nightFixed = null;
  if (!t.req){
    t.req = t.cells.map(c => cls(c) === 'leave' ? c : '');
    t.reqApplied = t.req.map(r => !!r);
  }
  if (t.reqExempt === undefined) t.reqExempt = /非|学生|アルバイト/.test(t.koyo || '');
  if (t.histLeave === undefined) t.histLeave = t.cells.filter(c => cls(c) === 'leave').length;
  if (!t.auto && t.part === undefined) t.part = inferPart(t, S);
}
// 希望休・休暇の入力内容を勤務表に反映（固定）
function applyRequests(S){
  for (const t of S.staff){
    for (let d = 0; d < S.D; d++){
      const r = t.req[d];
      if (r){ t.cells[d] = r === '希望休' ? '公' : r; t.pins[d] = true; t.reqApplied[d] = true; }
      else if (t.reqApplied[d]){ t.reqApplied[d] = false; t.pins[d] = false; t.cells[d] = ''; }
    }
  }
}
// 翌月を始める：前月末の夜勤明けを引き継ぎ、他はクリア
function newMonth(S, y, m){
  const D = new Date(y, m, 0).getDate();
  for (const t of S.staff){
    const carry = t.cells[t.cells.length - 1] === '夜';
    t.cells = Array(D).fill(''); t.pins = Array(D).fill(false);
    t.req = Array(D).fill(''); t.reqApplied = Array(D).fill(false); t.from = 0;
    if (carry){ t.cells[0] = '／'; t.pins[0] = true; }
  }
  S.sections.forEach(x => { x.D = D; });
  S.y = y; S.m = m; S.D = D; S.holidays = [];
}

// ユニット型（3〜5階）の標準：最低＝早1・日1・遅1、目標＝平日 早1・日2・遅2／土日祝は最低と同じ
function applyUnitPreset(S){
  for (const U of unitsOf(S)){
    if (!/^[3-5]階/.test(U.key)) continue;
    for (const l of U.labels){
      const k = U.key + '/' + l;
      S.needs[k] = Object.assign(S.needs[k] || {}, { '早': { wk: 1, we: 1 }, '日': { wk: 2, we: 1 }, '遅': { wk: 2, we: 1 } });
      S.minNeeds[k] = Object.assign(S.minNeeds[k] || {}, { '早': { wk: 1, we: 1 }, '日': { wk: 1, we: 1 }, '遅': { wk: 1, we: 1 } });
    }
  }
}
function resetNeeds(S){
  S.needs = inferNeeds(S);
  S.minNeeds = inferNeeds(S, true);
  applyUnitPreset(S);
}
function dayInfo(S){
  const wd = [], cl = [];
  for (let d = 0; d < S.D; d++){
    const dow = new Date(S.y, S.m - 1, d + 1).getDay();
    wd.push(dow);
    cl.push(dow === 0 || dow === 6 || S.holidays.includes(d + 1) ? 'we' : 'wk');
  }
  return { wd, cl };
}
// 自動作成の単位＝フロア（部署）。AB／CDなどのラベルごとに人数を持ち、遅E・準夜勤はフロア共通
const FLOOR_SHIFTS = ['遅E','準夜勤'];
function unitsOf(S){
  const map = new Map();
  for (const t of S.staff) if (t.auto){
    const sec = S.sections.find(x => x.id === t.sec);
    if (!map.has(sec.title)) map.set(sec.title, { key: sec.title, staff: [], labels: [] });
    const g = map.get(sec.title);
    g.staff.push(t);
    if (!g.labels.includes(t.label)) g.labels.push(t.label);
  }
  return [...map.values()];
}
function scopesOf(U, sh){
  if (FLOOR_SHIFTS.includes(sh)) return [{ key: U.key + '/*', label: '', members: U.staff }];
  return U.labels.map(l => ({ key: U.key + '/' + l, label: l, members: U.staff.filter(t => t.label === l) }));
}
function mode(arr){
  const f = {}; arr.forEach(v => f[v] = (f[v] || 0) + 1);
  let best = 0, bf = -1;
  for (const k in f) if (f[k] > bf || (f[k] === bf && +k > best)){ best = +k; bf = f[k]; }
  return best;
}
// 現在の表から1日の人数を推定：目標＝最頻値、最低＝実績の最小値（夜勤は最頻値）
function inferNeeds(S, useMin){
  const { cl } = dayInfo(S), out = {};
  for (const U of unitsOf(S)){
    for (const sh of SHIFTS) for (const sc of scopesOf(U, sh)){
      const o = { wk: [], we: [] };
      for (let d = 0; d < S.D; d++) o[cl[d]].push(sc.members.filter(t => t.cells[d] === sh).length);
      const pick = a => !a.length ? 0 : useMin && sh !== '夜' ? Math.min(...a) : mode(a);
      (out[sc.key] = out[sc.key] || {})[sh] = { wk: pick(o.wk), we: pick(o.we) };
    }
  }
  return out;
}

// ルールチェック（自動作成の点数づけと画面表示で共用）
function checkUnit(U, S, di, out){
  let score = 0; const D = S.D, max = S.maxConsec;
  const add = (sev, t, d, msg, w) => { score += sev === 'E' ? 100 : (w || 12); if (out) out.push({ sev, unit: U.key, s: t ? t.id : -1, d, msg }); };
  for (const t of U.staff){
    const c = t.cells; let run = 0, rest = 0;
    for (let d = 0; d < D; d++){
      const v = c[d];
      if (v === '夜' && d + 1 < D){
        if (c[d+1] !== '／') add('E', t, d + 1, '夜勤の翌日は明け（／）にしてください');
        else if (d + 2 < D && isWorkish(c[d+2])) add('W', t, d + 2, '夜勤明けの翌日は公休が望ましい');
      }
      if (v === '／' && d > 0 && c[d-1] !== '夜') add('E', t, d, '／（明け）の前日が夜勤ではありません');
      if (d > 0 && c[d-1] === '遅' && v === '早') add('W', t, d, '遅番の翌日に早番（勤務間隔が短い）');
      if (d > 0 && c[d-1] === '準夜勤' && (v === '早' || v === '日')) add('W', t, d, '準夜勤の翌日に日勤・早番');
      if (isWorkish(v)){ run++; if (run === max + 1) add('E', t, d, `連続勤務が${max}日を超えています`); }
      else run = 0;
      if (v === '公') rest++;
    }
    if (t.target > 0 && rest !== t.target) add('E', t, -1, `公休が${rest}日（目標${t.target}日）`);
  }
  for (let d = 0; d < D; d++){
    for (const sh of SHIFTS) for (const sc of scopesOf(U, sh)){
      const need = ((S.needs[sc.key] || {})[sh] || {})[di.cl[d]] || 0;
      const mn = Math.min(need, (((S.minNeeds || {})[sc.key] || {})[sh] || {})[di.cl[d]] ?? need);
      const n = sc.members.reduce((a, t) => a + (t.cells[d] === sh ? 1 : 0), 0);
      const nm = (sc.label ? sc.label + ' ' : '') + sh;
      if (n < mn) add('E', null, d, `${nm}が${n}人（最低${mn}人）`);
      else if (n < need) add('W', null, d, `${nm}が${n}人（目標${need}人）`, 5 * (need - n));
      else if (n > need && sh !== '日') add('W', null, d, `${nm}が${n}人（必要${need}人）で多い`);
    }
  }
  const nc = U.staff.filter(t => t.canNight && t.nightFixed == null).map(t => t.cells.filter(x => x === '夜').length);
  if (nc.length){ const df = Math.max(...nc) - Math.min(...nc); if (df > 1) score += 6 * (df - 1); }
  return score;
}
function validateAll(S){
  const di = dayInfo(S), out = []; let total = 0;
  for (const u of unitsOf(S)) total += checkUnit(u, S, di, out);
  for (const t of S.staff){
    const secT = S.sections.find(x => x.id === t.sec).title;
    const rq = t.req.filter(r => r === '希望休').length;
    if (!t.reqExempt && S.reqLimit != null && rq > S.reqLimit){ out.push({ sev: 'W', unit: secT, s: t.id, d: -1, msg: `希望休が${rq}日（上限${S.reqLimit}日）` }); total += 12; }
    if (t.auto || !t.part) continue;
    const sec = secT;
    t.cells.forEach((v, d) => {
      if (cls(v) === 'work' && !t.part.allowed[dowOf(S, d)]){ out.push({ sev: 'W', unit: sec, s: t.id, d, msg: '出勤可能曜日以外に勤務が入っています' }); total += 12; }
    });
    if (t.part.restSym === '公'){
      const r = t.cells.filter(v => v === '公').length;
      if (r !== t.part.restTarget){ out.push({ sev: 'W', unit: sec, s: t.id, d: -1, msg: `公休が${r}日（目標${t.part.restTarget}日）` }); total += 12; }
    }
  }
  return { issues: out, score: total };
}

// 自動作成
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function genUnit(U, S, di, mode, seed){
  const rnd = mulberry32(seed), D = S.D, max = S.maxConsec;
  const st = U.staff, n = st.length;
  const needS = (sc, sh, d) => ((S.needs[sc.key] || {})[sh] || {})[di.cl[d]] || 0;
  const minS = (sc, sh, d) => Math.min(needS(sc, sh, d), (((S.minNeeds || {})[sc.key] || {})[sh] || {})[di.cl[d]] ?? needS(sc, sh, d));
  const scs = sh => scopesOf(U, sh).map(sc => ({ ...sc, idx: new Set(sc.members.map(m => st.indexOf(m))) }));
  // 作業用コピー
  const orig = st.map(t => t.cells.slice());
  const lock = st.map((t, i) => t.cells.map((v, d) => d < t.from || t.pins[d] || cls(v) === 'leave' || (mode === 'fill' && v !== '') || (d === 0 && v === '／')));
  for (let i = 0; i < n; i++) for (let d = 0; d < D; d++){
    if (lock[i][d] && st[i].cells[d] === '夜' && d + 1 < D){ lock[i][d+1] = true; st[i].cells[d+1] = '／'; }
  }
  for (let i = 0; i < n; i++) for (let d = 0; d < D; d++) if (!lock[i][d]) st[i].cells[d] = '';
  const c = st.map(t => t.cells);
  const free = (i, d) => !lock[i][d] && c[i][d] === '';
  const haveS = (sc, sh, d) => { let k = 0; for (const i of sc.idx) if (c[i][d] === sh) k++; return k; };
  const runBefore = (i, d) => { let k = 0; while (d - 1 - k >= 0 && isWorkish(c[i][d-1-k])) k++; return k; };
  const nextOk = (i, d) => d >= D || c[i][d] === '' || cls(c[i][d]) === 'off' || cls(c[i][d]) === 'leave';
  // 前月からの夜勤明け → 翌日は公休
  for (let i = 0; i < n; i++) if (c[i][0] === '／' && D > 1 && free(i, 1)) c[i][1] = '公';

  // 夜勤・準夜勤の回数を、出られる日数に応じて均等に配分（個別指定があればそれを優先）
  const nT = st.map(() => 0), jT = st.map(() => 0);
  const share = (sh, T, can) => {
    for (const sc of scs(sh)){
      const mem = [...sc.idx].filter(i => st[i][can]);
      let total = 0; for (let d = 0; d < D; d++) total += Math.max(0, needS(sc, sh, d) - haveS(sc, sh, d));
      const w = mem.map(i => { let f = 0; for (let d = 0; d < D; d++) if (free(i, d)) f++; return f; });
      const sw = w.reduce((a, b) => a + b, 0) || 1;
      mem.forEach((i, k) => { T[i] = c[i].filter(x => x === sh).length + total * w[k] / sw; });
    }
  };
  share('夜', nT, 'canNight'); share('準夜勤', jT, 'canJun');
  st.forEach((t, i) => { if (t.nightFixed != null) nT[i] = t.nightFixed; });
  // 夜勤
  const nCount = i => c[i].filter(x => x === '夜').length;
  for (let d = 0; d < D; d++) for (const sc of scs('夜')){
    let k = needS(sc, '夜', d) - haveS(sc, '夜', d);
    while (k > 0){
      let cand = [];
      for (const useCap of [true, false]){
        cand = [];
        for (const i of sc.idx){
          if (!st[i].canNight || !free(i, d)) continue;
          if (d + 1 < D && !free(i, d + 1)) continue;
          if (!nextOk(i, d + 2) || runBefore(i, d) > max - 2) continue;
          if (useCap && nCount(i) >= Math.ceil(nT[i])) continue;
          cand.push([(nCount(i) + 1) / Math.max(nT[i], 0.5) + rnd() * 0.4, i]);
        }
        if (cand.length) break;
      }
      if (!cand.length) break;
      cand.sort((a, b) => a[0] - b[0]);
      const i = cand[0][1];
      c[i][d] = '夜';
      if (d + 1 < D) c[i][d+1] = '／';
      if (d + 2 < D && free(i, d + 2)) c[i][d+2] = '公';
      k--;
    }
  }
  // 準夜勤
  const jCount = i => c[i].filter(x => x === '準夜勤').length;
  for (let d = 0; d < D; d++) for (const sc of scs('準夜勤')){
    let k = needS(sc, '準夜勤', d) - haveS(sc, '準夜勤', d);
    while (k > 0){
      let cand = [];
      for (const useCap of [true, false]){
        cand = [];
        for (const i of sc.idx){
          if (!st[i].canJun || !free(i, d) || runBefore(i, d) > max - 1) continue;
          if (d + 1 < D && !(free(i, d + 1) || c[i][d+1] === '公')) continue;
          if (useCap && jCount(i) >= Math.ceil(jT[i])) continue;
          cand.push([(jCount(i) + 1) / Math.max(jT[i], 0.5) + rnd() * 0.4, i]);
        }
        if (cand.length) break;
      }
      if (!cand.length) break;
      cand.sort((a, b) => a[0] - b[0]);
      const i = cand[0][1];
      c[i][d] = '準夜勤';
      if (d + 1 < D && free(i, d + 1)) c[i][d+1] = '公';
      k--;
    }
  }
  // 公休：余裕のある日から置く
  const dayShiftScopes = ['早', '日', '遅', '遅E'].map(sh => [sh, scs(sh)]);
  const dayNeed = d => dayShiftScopes.reduce((a, [sh, l]) => a + l.reduce((b, sc) => b + needS(sc, sh, d), 0), 0);
  const slack = []; for (let d = 0; d < D; d++){ let a = 0; for (let i = 0; i < n; i++) if (free(i, d)) a++; slack.push(a - dayNeed(d)); }
  const rem = st.map((t, i) => (t.target || 0) - c[i].filter(x => x === '公').length);
  let progress = true;
  while (progress){
    progress = false;
    const order = rem.map((r, i) => [r + rnd() * 0.5, i]).sort((a, b) => b[0] - a[0]);
    for (const [, i] of order){
      if (rem[i] <= 0) continue;
      let best = -1, bs = -1e9;
      for (let d = 0; d < D; d++){
        if (!free(i, d)) continue;
        let L = 0, R = 0;
        while (d - 1 - L >= 0 && (isWorkish(c[i][d-1-L]) || free(i, d-1-L))) L++;
        while (d + 1 + R < D && (isWorkish(c[i][d+1+R]) || free(i, d+1+R))) R++;
        let sc = slack[d] + rnd() * 0.6;
        if (d > 0 && c[i][d-1] === '公') sc -= 0.8;
        if (d + 1 < D && c[i][d+1] === '公') sc -= 0.8;
        if (L + R + 1 > max) sc += 4 - Math.abs(L - R) * 0.4;
        if (sc > bs){ bs = sc; best = d; }
      }
      if (best < 0){ rem[i] = 0; continue; }
      c[i][best] = '公'; slack[best]--; rem[i]--; progress = true;
    }
  }
  // 日勤帯
  for (let d = 0; d < D; d++){
    for (const pass of [0, 1]) for (const sh of ['遅E', '遅', '早', '日']) for (const sc of scs(sh)){
      let k = (pass === 0 ? minS(sc, sh, d) : needS(sc, sh, d)) - haveS(sc, sh, d);
      while (k > 0){
        const cand = [];
        for (const i of sc.idx){
          if (!free(i, d)) continue;
          if (sh === '遅E' && !st[i].canE) continue;
          const pv = d > 0 ? c[i][d-1] : '';
          if (sh === '早' && (pv === '遅' || pv === '遅E' || pv === '準夜勤')) continue;
          const pf = sh === '遅E' ? st[i].pref['遅'] : st[i].pref[sh];
          cand.push([-(pf / (st[i].pref['早'] + st[i].pref['日'] + st[i].pref['遅'])) - rnd() * 0.3, i]);
        }
        if (!cand.length) break;
        cand.sort((a, b) => a[0] - b[0]);
        c[cand[0][1]][d] = sh; k--;
      }
    }
    for (let i = 0; i < n; i++) if (free(i, d)) c[i][d] = '日';
  }
  // 山登り法：休と勤務の入れかえで点数を下げる
  const movable = (i, d) => !lock[i][d] && ['早', '日', '遅', '遅E', '公'].includes(c[i][d]);
  let cur = checkUnit(U, S, di, null);
  for (let it = 0; it < 12000 && cur > 0; it++){
    const i = (rnd() * n) | 0, j = (rnd() * n) | 0;
    let a, b, x, y;
    if (rnd() < 0.6){
      a = (rnd() * D) | 0; b = (rnd() * D) | 0;
      if (a === b || !movable(i, a) || !movable(i, b) || c[i][a] === c[i][b]) continue;
      [c[i][a], c[i][b]] = [c[i][b], c[i][a]];
      const s2 = checkUnit(U, S, di, null);
      if (s2 <= cur) cur = s2; else [c[i][a], c[i][b]] = [c[i][b], c[i][a]];
    } else {
      a = (rnd() * D) | 0;
      if (i === j || !movable(i, a) || !movable(j, a) || c[i][a] === c[j][a]) continue;
      if (c[i][a] === '公' || c[j][a] === '公') continue; // 公休数を崩さない
      if (c[i][a] === '遅E' && !st[j].canE || c[j][a] === '遅E' && !st[i].canE) continue;
      [c[i][a], c[j][a]] = [c[j][a], c[i][a]];
      const s2 = checkUnit(U, S, di, null);
      if (s2 <= cur) cur = s2; else [c[i][a], c[j][a]] = [c[j][a], c[i][a]];
    }
  }
  const result = c.map(r => r.slice());
  st.forEach((t, i) => { t.cells = orig[i]; });
  return { cells: result, score: cur };
}
// 非常勤・日勤職員：今までの働き方（記号・曜日・日数）を原則に出勤日を均等に配置
function genPart(t, S, mode, seed){
  const rnd = mulberry32(seed), D = S.D, p = t.part, c = t.cells.slice();
  const lock = c.map((v, d) => d < t.from || t.pins[d] || cls(v) === 'leave' || (mode === 'fill' && v !== ''));
  for (let d = 0; d < D; d++) if (!lock[d]) c[d] = '';
  const freeDays = [], allowedFree = [];
  for (let d = 0; d < D; d++) if (!lock[d]){ freeDays.push(d); if (p.allowed[dowOf(S, d)]) allowedFree.push(d); }
  const lockedWork = c.filter((v, d) => lock[d] && cls(v) === 'work').length;
  const lockedRest = c.filter((v, d) => lock[d] && v === '公').length;
  const leaveNow = c.filter(v => cls(v) === 'leave').length;
  let W;
  if (p.restSym === '公') W = Math.min(allowedFree.length, freeDays.length - Math.max(0, p.restTarget - lockedRest));
  else W = Math.min(allowedFree.length, Math.max(0, p.workTarget - lockedWork - Math.max(0, leaveNow - (t.histLeave || 0))));
  W = Math.max(0, W);
  const load = {}, chosen = [];
  c.forEach((v, d) => { if (lock[d] && cls(v) === 'work') load[weekOf(S, d)] = (load[weekOf(S, d)] || 0) + 1; });
  for (let k = 0; k < W; k++){
    let best = -1, bs = 1e9;
    for (const d of allowedFree){
      if (chosen.includes(d)) continue;
      const w = weekOf(S, d), l = load[w] || 0;
      let md = 7; chosen.forEach(x => { md = Math.min(md, Math.abs(x - d)); });
      const sc = l * 10 + (l >= p.perWeek ? 50 : 0) - md * 0.5 + rnd();
      if (sc < bs){ bs = sc; best = d; }
    }
    if (best < 0) break;
    chosen.push(best); load[weekOf(S, best)] = (load[weekOf(S, best)] || 0) + 1;
  }
  for (const d of freeDays) c[d] = chosen.includes(d) ? p.sym : p.restSym;
  return c;
}
function generateAll(S, mode){
  applyRequests(S);
  const di = dayInfo(S);
  for (const U of unitsOf(S)){
    let best = null;
    for (let k = 0; k < 6; k++){
      const r = genUnit(U, S, di, mode, 1000 + k * 7919);
      if (!best || r.score < best.score) best = r;
    }
    U.staff.forEach((t, i) => { t.cells = best.cells[i]; });
  }
  for (const t of S.staff) if (!t.auto && t.part) t.cells = genPart(t, S, mode, 500 + t.id);
}


// ---- 常勤換算（e3Shift「常勤換算値出力」の考え方：常勤換算値＝勤務時間合計÷1週間基本時間）----
const hmToH = x => { const m = /^(\d{1,2}):(\d{2})$/.exec(String(x || '')); return m ? +m[1] + (+m[2]) / 60 : null; };
function defaultFte(){
  return { confirmed: false, weekHours: 40, method: 'cal', night: { s: '17:00', e: '09:00' },
    hours: { '早': { s: '07:00', e: '16:00', brk: 1 }, '日': { s: '08:30', e: '17:30', brk: 1 }, '遅': { s: '11:00', e: '20:00', brk: 1 },
             '遅E': { s: '12:30', e: '21:30', brk: 1 }, '準夜勤': { s: '16:00', e: '21:00', brk: 0 }, '夜': { s: '16:30', e: '09:30', brk: 2 } },
    leave: { '有休': 'add', 'リ休': 'add', '誕休': 'add', '特休': 'add', '研修': 'work', '忌引': 'none', '産休': 'none', '欠': 'none' } };
}
function initFte(t, S, seen){
  if (!S.fte) S.fte = defaultFte();
  if (!t.fte){
    const part = /非|派|学生|アルバイト/.test(t.koyo || '');
    const dup = seen && seen.has(t.name);
    t.fte = { type: part ? '非常勤' : '常勤', calc: part || dup ? '計算' : '1固定', week: S.fte.weekHours, job: S.sections.find(x => x.id === t.sec).title };
  }
  if (seen) seen.add(t.name);
}
function shiftSpan(sym, S){
  const h = S.fte.hours[sym];
  if (h){
    const s = hmToH(h.s), e0 = hmToH(h.e); if (s == null || e0 == null) return null;
    const e = e0 <= s ? e0 + 24 : e0;
    return { s, e, work: Math.max(0, e - s - (+h.brk || 0)) };
  }
  const m = /^(\d+(?:\.\d+)?)-(\d+(?:\.\d+)?)$/.exec(sym);
  return m ? { s: +m[1], e: +m[2], work: +m[2] - +m[1] } : null;
}
function nightOverlap(sp, S){
  const ns = hmToH(S.fte.night.s), ne0 = hmToH(S.fte.night.e); if (ns == null || ne0 == null) return 0;
  const ne = ne0 <= ns ? ne0 + 24 : ne0; let o = 0;
  for (const k of [-1, 0, 1]) o += Math.max(0, Math.min(sp.e, ne + 24 * k) - Math.max(sp.s, ns + 24 * k));
  return o;
}
function calcFte(S){
  const F = S.fte, weeks = F.method === 'cal' ? S.D / 7 : 4, rows = [];
  const nightWin = (() => { const a = hmToH(F.night.s), b = hmToH(F.night.e); return a == null || b == null ? 0 : (b <= a ? b + 24 : b) - a; })();
  const grp = {}, job = {}, add = (o, k, f, type) => { const g = o[k] = o[k] || { all: 0, full: 0, part: 0 }; g.all += f; g[type === '常勤' ? 'full' : 'part'] += f; };
  for (const t of S.staff){
    const q = t.fte, daily = (q.week || 0) / 5; let hours = 0, night = 0, unknown = 0;
    for (const v of t.cells){
      const k = cls(v); if (k === 'blank' || k === 'off' || k === 'ake') continue;
      if (k === 'leave'){ const m = F.leave[v] || 'none'; if (m === 'work' || (m === 'add' && q.type === '常勤')) hours += daily; continue; }
      const sp = shiftSpan(v, S);
      if (sp){ hours += sp.work; night += nightOverlap(sp, S); } else unknown++;
    }
    const fte = q.calc === '1固定' ? 1 : (q.week > 0 ? hours / (q.week * weeks) : 0);
    rows.push({ id: t.id, hours, fte, night, unknown });
    const gk = S.sections.find(x => x.id === t.sec).title;
    add(job, q.job, fte, q.type);
    (grp[gk] = grp[gk] || { night: 0, f: { all: 0, full: 0, part: 0 } }).night += night;
    add({ _: grp[gk].f }, '_', fte, q.type);
  }
  const nightAvg = {};
  for (const g in grp) nightAvg[g] = nightWin > 0 ? grp[g].night / (nightWin * S.D) : 0;
  return { rows, job, grp, nightAvg, nightWin, weeks };
}

// Excelへ貼り戻す形式
function toTSV(S){
  const di = dayInfo(S), DOW = '日月火水木金土', lines = [];
  lines.push(`令和${S.y - 2018}年${S.m}月度\t勤務予定表`);
  for (const sec of S.sections){
    const days = []; for (let d = 1; d <= sec.D; d++) days.push(d);
    lines.push([sec.title, '', ...days].join('\t'));
    lines.push(['No', '氏　名', ...di.wd.slice(0, sec.D).map(w => DOW[w]), '公休', '有休', 'リ休', '誕休', '夜'].join('\t'));
    let lab = null;
    for (const t of S.staff.filter(x => x.sec === sec.id)){
      if (t.label !== lab && t.label){ lines.push(t.label); } lab = t.label;
      const k = s => t.cells.filter(c => c === s).length;
      lines.push([t.koyo, t.name, ...t.cells, k('公'), k('有休'), k('リ休'), k('誕休'), k('夜')].join('\t'));
    }
    lines.push('');
  }
  return lines.join('\n');
}

  const css = document.querySelector('style').textContent;
  const doc = `<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'"><meta name="robots" content="noindex,nofollow"><title>勤務表 ${S.y}年${S.m}月（閲覧用）</title><style>${css}table{border-collapse:collapse;font-size:12px}th,td{border:1px solid #c9ced8;min-width:28px;text-align:center;height:22px}td.nm{text-align:left;padding:0 6px;white-space:nowrap}th.sec{background:var(--band);text-align:left}th.w6{color:#1565c0}th.w0{color:#d93025}td.c{cursor:default}</style></head><body><main><h3>勤務表 ${S.y}年${S.m}月（閲覧専用・${new Date().toLocaleString('ja-JP')}作成）</h3>${t}</main></body></html>`.replace(/<td class="(\w+)">/g, '<td class="c $1">');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([doc], { type: 'text/html' }));
  a.download = `勤務表_${S.y}-${String(S.m).padStart(2, '0')}_閲覧用.html`;
  a.click(); setStatus('閲覧用ファイルを保存しました。共有フォルダに置いてください');
};
$('#bPrint').onclick = () => { show('sheet'); window.print(); };

const pal = $('#pal'); let palTarget = null;
pal.innerHTML = PALETTE.map(p => `<button data-v="${p}">${p || '消去'}</button>`).join('');
pal.onclick = e => {
  const b = e.target.closest('button'); if (!b || !palTarget) return;
  const t = S.staff[palTarget.s], v = b.dataset.v, d = palTarget.d;
  t.cells[d] = v;
  if (v === '夜' && d + 1 < S.D && !t.cells[d+1]) t.cells[d+1] = '／';
  if (cls(v) === 'leave') t.pins[d] = true;
  pal.style.display = 'none'; save(); renderSheet();
};
document.addEventListener('click', e => {
  const td = e.target.closest('td.c');
  if (td && td.closest('#grid')){
    const s = +td.dataset.s, d = +td.dataset.d;
    if (e.shiftKey){ S.staff[s].pins[d] = !S.staff[s].pins[d]; save(); renderSheet(); return; }
    palTarget = { s, d };
    const r = td.getBoundingClientRect();
    pal.style.display = 'block';
    pal.style.left = Math.min(r.left, innerWidth - 240) + 'px';
    pal.style.top = Math.min(r.bottom + 2, innerHeight - 170) + 'px';
    return;
  }
  if (!e.target.closest('#pal')) pal.style.display = 'none';
  const is = e.target.closest('.iss');
  if (is){
    const s = +is.dataset.s, d = +is.dataset.d;
    const el = document.getElementById('c' + s + '_' + Math.max(d, 0));
    if (el){ el.scrollIntoView({ block: 'center', inline: 'center' }); el.style.transition = 'none'; el.style.boxShadow = '0 0 0 3px #1a56c4'; setTimeout(() => { el.style.boxShadow = ''; }, 1200); }
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.fte){ const q = S.staff[+t.dataset.fte].fte, f = t.dataset.f; q[f] = f === 'week' ? (+t.value || 0) : t.value; save(); renderFte(); return; }
  if (t.dataset.fh){ const hh = S.fte.hours[t.dataset.fh]; hh[t.dataset.f] = t.dataset.f === 'brk' ? (+t.value || 0) : t.value; S.fte.confirmed = false; save(); renderFte(); return; }
  if (t.dataset.fl){ S.fte.leave[t.dataset.fl] = t.value; save(); renderFte(); return; }
  if (t.id === 'fWeek'){ S.fte.weekHours = +t.value || 40; save(); return; }
  if (t.id === 'fMethod'){ S.fte.method = t.value; save(); renderFte(); return; }
  if (t.id === 'fNs' || t.id === 'fNe'){ S.fte.night[t.id === 'fNs' ? 's' : 'e'] = t.value; save(); renderFte(); return; }
  if (t.id === 'reqLim'){ S.reqLimit = Math.max(0, +t.value || 0); save(); renderReq(); return; }
  if (t.dataset.ex){ S.staff[+t.dataset.ex].reqExempt = t.checked; save(); renderReq(); return; }
  if (t.dataset.pt){
    const q = S.staff[+t.dataset.pt].part, f = t.dataset.f;
    if (f === 'allowed') q.allowed[+t.dataset.w] = t.checked;
    else if (f === 'sym' || f === 'restSym') q[f] = t.value;
    else q[f] = +t.value || 0;
    save(); return;
  }
  if (t.id === 'maxC'){ S.maxConsec = Math.max(3, +t.value || 5); save(); return; }
  if (t.id === 'hol'){ S.holidays = t.value.split(/[,、\s]+/).map(Number).filter(n => n >= 1 && n <= 31); save(); return; }
  if (t.dataset.nu){ S[t.dataset.src][t.dataset.nu][t.dataset.sh][t.dataset.c] = Math.max(0, +t.value || 0); save(); return; }
  if (t.dataset.st){
    const s = S.staff[+t.dataset.st], f = t.dataset.f;
    s[f] = t.type === 'checkbox' ? t.checked : (t.value === '' && f === 'nightFixed' ? null : (+t.value || 0)); save();
  }
});
document.addEventListener('click', e => {
  const rc = e.target.closest('td[data-rs]');
  if (rc && S){
    const t = S.staff[+rc.dataset.rs], d = +rc.dataset.rd, i = REQ_TYPES.indexOf(t.req[d]);
    t.req[d] = i + 1 < REQ_TYPES.length ? REQ_TYPES[i + 1] : '';
    const r = t.req[d]; save();
    rc.className = 'c ' + (r === '希望休' ? 'off' : r ? 'lv' : '');
    rc.textContent = r ? { '希望休': '休', '有休': '有', 'リ休': 'リ', '誕休': '誕', '研修': '研' }[r] : '';
    const rcn = t.req.filter(x => x === '希望休').length;
    $('#rc' + t.id).textContent = rcn; $('#rc' + t.id).className = 'sum' + (!t.reqExempt && rcn > S.reqLimit ? ' bad' : '');
    $('#rl' + t.id).textContent = t.req.filter(x => x && x !== '希望休').length;
    return;
  }
  if (e.target.id === 'bFteOk' && S){ S.fte.confirmed = true; save(); renderFte(); return; }
  if (e.target.id === 'bNewMonth' && S){
    const y = +$('#nmY').value, m = +$('#nmM').value;
    if (!(m >= 1 && m <= 12) || y < 2000) return alert('年月を確認してください');
    if (!confirm(`${y}年${m}月を始めます。現在の勤務と希望休はクリアされます。よろしいですか？`)) return;
    newMonth(S, y, m); save(); curSec = 'all'; show('req'); setStatus(`${y}年${m}月を開始しました。希望休を入力してください`);
    return;
  }
  if (e.target.id === 'bRe' && S){ resetNeeds(S); save(); renderRules(); }
});
load(); show(S ? 'sheet' : 'import');
</script>
</body>
</html>
